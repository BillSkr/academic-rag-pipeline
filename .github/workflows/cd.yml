name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Trigger Render Backend deploy hook
        env:
          BACKEND_URL: ${{ secrets.RENDER_BACKEND_HOOK_URL }}
        run: |
          if [ -z "$BACKEND_URL" ]; then
            echo "⚠️  RENDER_BACKEND_HOOK_URL secret is not set – skipping backend deploy hook."
          else
            curl -fsSL -X POST "$BACKEND_URL"
            echo "✅ Backend Render deploy hook triggered."
          fi

      - name: Trigger Render Frontend deploy hook
        env:
          FRONTEND_URL: ${{ secrets.RENDER_FRONTEND_HOOK_URL }}
        run: |
          if [ -z "$FRONTEND_URL" ]; then
            echo "⚠️  RENDER_FRONTEND_HOOK_URL secret is not set – skipping frontend deploy hook."
          else
            curl -fsSL -X POST "$FRONTEND_URL"
            echo "✅ Frontend Render deploy hook triggered."
          fi
