name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Trigger Render deploy hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          # Fail early with a clear message if the secret is missing
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "ERROR: RENDER_DEPLOY_HOOK_URL secret is not set. Set it in repository Settings → Secrets and variables → Actions." >&2
            exit 1
          fi

          # Use --fail and --show-error so we fail the step on non-2xx responses and get useful output
          curl --fail --show-error -X POST "$RENDER_DEPLOY_HOOK_URL"
