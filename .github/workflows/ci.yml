name: CI

# Run on every push to main/develop, and on all pull requests targeting main
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ── Test job ────────────────────────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Install all runtime + dev dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov ruff

      # Lint source code with Ruff (fast Python linter)
      - name: Lint with ruff
        run: ruff check src/ --ignore E501,BLE001,RUF013

      # Run the full test suite and collect coverage
      - name: Run tests
        run: pytest tests/ --cov=src --cov-report=xml

  # ── Docker build job ────────────────────────────────────────────────────────
  build-docker:
    runs-on: ubuntu-latest
    needs: test   # only build if tests pass

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Verify the Docker image builds successfully
      - name: Build Docker image
        run: docker build -t rag-assistant:${{ github.sha }} .
