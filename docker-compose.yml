services:
  # Ollama runs on Windows natively (not in Docker) - see native Ollama setup
  # Configure RAG app to connect to host Ollama via host.docker.internal:11434

  rag-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag-app
    ports:
      - "8001:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - GROQ_API_KEY=${GROQ_API_KEY}
    command: ["uvicorn", "src.api:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--timeout-keep-alive", "120", "--timeout-graceful-shutdown", "60"]
    volumes:
      - ./src:/app/src
      - ./data:/app/data
      - ./src/vectordb:/app/src/vectordb
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G
    networks:
      - rag-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=http://localhost:8001
    container_name: rag-frontend
    ports:
      - "4173:4173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8001
    depends_on:
      - rag-app
    networks:
      - rag-network
    restart: unless-stopped

networks:
  rag-network:
    driver: bridge
